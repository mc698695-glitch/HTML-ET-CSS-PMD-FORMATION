<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire</title>
</head>
<style>
    /* Rectangle parfait */
.mon-rectangle {
    width: 150px;
  height: 100px;
  background-color: #2ecc71;
  margin-bottom: 10px;
}

/* Cercle */
.mon-cercle {
    width: 100px;
  height: 100px;
  background-color: #f1c40f;
  clip-path: circle(50% at 50% 50%);
  margin-bottom: 10px;
}
/* Carre */
.mon-carre{
    width: 100px;
  height: 100px;
  background-color: #5e0ff1;
  margin-left: 0px;
  transform: none;
  margin-bottom: 10px;
}
/* Triangle */
.mon-triangle{

    width: 100px;
  height: 100px;
  background-color: #cc2e2e;
  clip-path: polygon(50% 0%, 0% 100%, 100% 100%);

}
</style>

<body>

    <header>
        <h1>Formes géomtriques</h1>
    </header>

    <main>
        <div class="mon-rectangle"></div>
        <div class="mon-cercle"></div>
        <div class="mon-carre"></div>
        <div class="mon-triangle"></div>

    </main>

    <footer>
        <p>&copy; 2026 - Mon formulaire</p>
    </footer>

</body>
</html>
